name: scrapers

on:
  pull_request:
    paths:
      - 'scrapers/**'
      - '.github/workflows/scrapers.yml'
  push:
    branches: [main]
    paths:
      - 'scrapers/**'
      - '.github/workflows/scrapers.yml'

defaults:
  run:
    working-directory: scrapers

jobs:
  scrapers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: scrapers/uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync deps
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest
