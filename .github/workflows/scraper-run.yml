name: scraper-run

# Daily scraper run on GitHub Actions' free tier. Free because the job is
# ~4 minutes wall time and the runner shuts down between invocations — no
# persistent host to pay for. 03:00 SGT = 19:00 UTC.

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

# Prevent overlapping runs if a manual dispatch overlaps the cron tick.
concurrency:
  group: scraper-run
  cancel-in-progress: false

defaults:
  run:
    working-directory: scrapers

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SCRAPER_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SCRAPER_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: scrapers/uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync deps
        run: uv sync --frozen

      - name: Verify env wired
        run: |
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SCRAPER_SUPABASE_URL and SCRAPER_SUPABASE_SERVICE_ROLE_KEY must be set as GitHub repo secrets."
            exit 1
          fi
          echo "supabase target host: $(echo "$SUPABASE_URL" | sed -E 's#https?://([^/]+).*#\1#')"

      - name: Diagnose Supabase key
        # Prints only non-secret claims (role/iss/ref/exp) from the JWT, or the
        # token format if it's not a JWT. Never echoes the signature.
        run: |
          python - <<'PY'
          import base64, json, os, sys
          key = os.environ.get('SUPABASE_SERVICE_ROLE_KEY', '')
          if not key:
              print('NO KEY SET'); sys.exit(1)
          if key.startswith('sb_secret_') or key.startswith('sb_publishable_'):
              print(f'FORMAT: new sb_* key (length {len(key)})')
              print('NOTE: not a JWT; claims not decodable from this token type.')
              sys.exit(0)
          parts = key.split('.')
          if len(parts) != 3:
              print(f'FORMAT: unknown ({len(parts)} segments, not 3 -> not a JWT, not sb_*)')
              sys.exit(0)
          mid = parts[1] + '=' * (-len(parts[1]) % 4)
          claims = json.loads(base64.urlsafe_b64decode(mid))
          print('FORMAT: JWT')
          print(f"role: {claims.get('role')}")
          print(f"iss:  {claims.get('iss')}")
          print(f"ref:  {claims.get('ref')}")
          print(f"exp:  {claims.get('exp')}  (claim only -- signature not verified here)")
          PY

      - name: Run scrapers
        run: uv run python -m runner
