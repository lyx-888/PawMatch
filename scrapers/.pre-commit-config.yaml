# Run ruff + mypy before every commit. Hooks live here (scrapers/-scoped);
# Node side uses husky at the repo root. We'll unify in Phase 1 if needed.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^scrapers/src/
        additional_dependencies: [pydantic>=2.8]
